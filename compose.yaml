services:
  fintree-postgres:
    restart: unless-stopped
    image: postgres:18-alpine
    container_name: fintree-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fintree-net

  fintree.api:
    restart: unless-stopped
    container_name: fintree-api
    build:
      context: .
      dockerfile: FinTree.Api/Dockerfile
    image: fintree.api:local
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      AllowedHosts: "${ASPNETCORE_ALLOWED_HOSTS:-fin-tree.ru;www.fin-tree.ru;localhost;127.0.0.1;[::1]}"
      Auth__JwtSecretKey: ${AUTH_JWT_SECRET_KEY}
      Auth__Issuer: ${AUTH_ISSUER}
      Auth__Audience: ${AUTH_AUDIENCE}
      Auth__AccessTokenLifetimeMinutes: ${AUTH_ACCESS_TOKEN_LIFETIME_MINUTES}
      Auth__RefreshTokenLifetimeDays: ${AUTH_REFRESH_TOKEN_LIFETIME_DAYS}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Telegram__Proxy: ${TELEGRAM_PROXY}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRINGS_DEFAULT}
      FxRates__ApiKey: ${FXRATES_API_KEY}
      Admin__OwnerEmailsCsv: ${ADMIN_OWNER_EMAILS}
      # Личный токен советника: хэш SHA-256 и UserId — в серверном .env; пусто = выключено
      PersonalAccess__Tokens__0__Name: advisor
      PersonalAccess__Tokens__0__TokenHash: ${FINTREE_PAT_0_HASH:-}
      PersonalAccess__Tokens__0__UserId: ${FINTREE_PAT_0_USER_ID:-}
      PersonalAccess__Tokens__0__Scopes__0: read
      PersonalAccess__Tokens__0__Scopes__1: retro:write
      PersonalAccess__Tokens__0__Scopes__2: notify
      # Совет «сколько и куда отложить» в ответе бота после записи зарплаты; пустые значения = выключено
      SalaryAdvice__UserId: ${SALARY_ADVICE_USER_ID:-}
      SalaryAdvice__SaveRate: ${SALARY_ADVICE_SAVE_RATE:-}
      SalaryAdvice__Category: ${SALARY_ADVICE_CATEGORY:-}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1}
    depends_on:
      - fintree-postgres
    networks:
      - fintree-net

  fintree.nginx:
    restart: unless-stopped
    container_name: fintree-nginx
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    image: fintree.nginx:local
    ports:
      - "80:80"
      - "127.0.0.1:8444:443"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - fintree.api
    networks:
      - fintree-net

  certbot:
    build:
      context: deploy/certbot
    image: fintree.certbot:local
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    # Folded scalar: keep every line at the same indent — more-indented lines
    # keep their newline and would split the shell command.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
      certbot renew --webroot -w /var/www/certbot
      --deploy-hook 'docker exec fintree-nginx nginx -s reload';
      sleep 12h & wait $${!};
      done"
    networks:
      - fintree-net

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
  certbot-www:

networks:
  fintree-net:
    driver: bridge
