name: Deploy (self-hosted)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Один деплой за раз: два пуша подряд не должны гонять docker compose параллельно.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & up via docker compose
        run: |
          docker compose --env-file /opt/fintree/.env up -d --build

      # nginx container is not recreated when its image is unchanged,
      # so reload explicitly to pick up renewed certificates and config.
      - name: Reload nginx
        run: |
          docker exec fintree-nginx nginx -t
          docker exec fintree-nginx nginx -s reload

      - name: Prune old Docker images & build cache
        if: always()
        run: |
          docker image prune -af --filter "until=168h"
          docker builder prune -af --filter "until=168h"
